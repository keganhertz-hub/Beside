<body><div id="app" class="app"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div><div id="onboarding" class="onboarding" hidden></div>
<script>
const ICON={listen:'♡',reset:'✳',clear:'⌁',beside:'◌',book:'▤',future:'✦',profile:'◉',home:'⌂',support:'✳',back:'←',arrow:'↗',edit:'✎',spark:'✧'};
const seed={playbook:[{id:'p1',title:'Name five things I can see',description:'A quick sensory reset when my thoughts start racing.',category:'Overthinking',why:'Helps bring me back to where I am.'},{id:'p2',title:'Take it outside for ten minutes',description:'A short walk with no destination or pace to hit.',category:'Stress',why:'A little movement makes the day feel less stuck.'},{id:'p3',title:'Send the honest text',description:'Tell someone I could use company, even if I don’t have the words.',category:'Loneliness',why:'Connection usually helps more than waiting until I feel ready.'}],future:[{id:'f1',trigger:'When I start doubting myself',message:'You have handled uncertain days before. You do not need to solve the whole thing right now. Just focus on the next step.',actions:['Take a short walk','Write down what is actually bothering me','Talk to someone I trust']}],contacts:[],onboarded:false,preferences:{}};
const read=()=>{try{return {...structuredClone(seed),...JSON.parse(localStorage.getItem('beside-data')||'{}')}}catch{return structuredClone(seed)}};let data=read(),page='Home',flow=null,flowStep=0,flowData={},toastTimer;const save=()=>localStorage.setItem('beside-data',JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,9);const toast=t=>{document.getElementById('toast-root').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',2200)};
const modes=[['listen','I need someone to listen','A little space to say what’s on your mind.'],['reset','I need to get my mind off things','A small shift to interrupt the loop.'],['clear','I need help thinking clearly','Sort through it and find one next step.'],['beside','I need somebody beside me','Find the words to reach someone you trust.']];
function nav(){return `<header class="topbar"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 29h9v-8h8v-8h8"/><path d="m26 9 7 4-7 4"/></svg></span>Beside</div><nav class="desktop-nav">${['Home','Support','My Playbook','Future Me','Profile'].map(n=>`<button class="nav-btn ${page===n?'active':''}" data-page="${n}">${n}</button>`).join('')}</nav><button class="profile-button" data-page="Profile" aria-label="Profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.5-4 2.7-6 6.5-6s6 2 6.5 6"/></svg></button></header>`}
const MOBILE_NAV_ICONS={home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7v9a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M9 21v-6h6v6"/></svg>',support:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 8.8c0 5-8.4 10.1-8.4 10.1S3.6 13.8 3.6 8.8A4.4 4.4 0 0 1 12 6.5a4.4 4.4 0 0 1 8.4 2.3Z"/><path d="M8 11.5h2l1-2.2 2 4.4 1-2.2h2"/></svg>',playbook:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',future:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/><path d="m18.5 3 .5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z"/></svg>',profile:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.5-4 2.7-6 6.5-6s6 2 6.5 6"/></svg>'};
function mobileNav(){const items=[['Home','home'],['Support','support'],['My Playbook','playbook'],['Future Me','future'],['Profile','profile']];return '<nav class="mobile-nav" aria-label="Main navigation">'+items.map(([n,i])=>'<button class="'+(page===n?'active':'')+'" data-page="'+n+'" aria-current="'+(page===n?'page':'false')+'"><span class="nav-ico">'+MOBILE_NAV_ICONS[i]+'</span><span class="nav-label">'+(n==='My Playbook'?'Playbook':n)+'</span></button>').join('')+'</nav>'}
function home(){return `<section class="hero"><div class="hero-copy"><div class="greeting">A little space for whatever today brings.</div><h1>You don’t have to figure everything out today.</h1><p>Whatever’s going on, you can start with what would help in this moment. One small step is enough.</p><button class="btn-primary" data-flow="moment">Help me with this moment <span>→</span></button></div><aside class="daily-card"><div><div class="label">A note for today</div><blockquote>“You can take the next ten minutes as they come.”</blockquote></div><div class="attribution">A gentle reminder, just for now</div></aside></section><div class="section-head"><div><h2>Or choose what would help</h2><p>There’s no wrong place to start.</p></div><button class="text-link" data-page="Support">See all support →</button></div><div class="mode-grid">${modes.map(([id,t,d])=>`<button class="mode-card ${id}" data-flow="${id}"><span class="mode-icon">${ICON[id]}</span><strong>${t}</strong><small>${d}</small></button>`).join('')}</div><div class="below-grid"><section class="panel"><div class="panel-title"><h3>Your Playbook</h3><button class="text-link" data-page="My Playbook">Open playbook →</button></div><div class="playbook-list">${data.playbook.slice(0,2).map(x=>`<div class="strategy-row"><span class="strategy-icon">✧</span><div><strong>${esc(x.title)}</strong><small>${esc(x.category)} · A small thing that helps</small></div></div>`).join('')||'<div class="empty">Save something that helps, for a day you need it.</div>'}</div></section><section class="panel future-panel"><span class="eyebrow">From a past you</span><h3>${esc(data.future[0]?.trigger||'A reminder for a difficult moment')}</h3><p>${esc(data.future[0]?.message||'Write a note for the version of you who might need it.')}</p><button class="btn-secondary" data-page="Future Me">Visit Future Me →</button></section></div><div class="connection-strip"><div><strong>You don’t have to hold it alone.</strong><p>Sometimes the next step is letting someone in.</p></div><button class="btn-secondary" data-flow="beside">Reach out to someone</button></div>`}
function support(){return `<div class="page-heading"><div><div class="eyebrow">Start wherever you are</div><h1>What would help<br>in this moment?</h1><p>You don’t need to have it all figured out. We can find a next step together.</p></div><button class="btn-primary" data-flow="moment">Help me choose →</button></div><div class="switch-grid">${modes.map(([id,t,d])=>`<button class="switch-card" data-flow="${id}"><span class="arrow">↗</span><span class="mode-icon ${id}">${ICON[id]}</span><h3>${t}</h3><p>${d}</p></button>`).join('')}</div><div class="safety"><strong>Need urgent help?</strong><p>Beside isn’t a crisis service. In the U.S., call or text <b>988</b> for the Suicide &amp; Crisis Lifeline. If you’re in immediate danger, contact emergency services.</p></div><div class="section-head"><div><h2>Support someone else</h2><p>Small, practical ways to show up for someone.</p></div><button class="text-link" data-page="Supporter Mode">Explore guides →</button></div>`}
function playbook(){return `<div class="page-heading"><div><div class="eyebrow">Your personal support system</div><h1>My Playbook</h1><p>Keep the things that genuinely help, close at hand.</p></div><button class="btn-primary" data-action="new-playbook">＋ Add to Playbook</button></div><div class="subnav">${['All','Overthinking','Stress','Loneliness','Motivation','Confidence','Relationships','General wellbeing'].map(x=>`<button data-filter="${x}" class="${(flowData.filter||'All')===x?'active':''}">${x}</button>`).join('')}</div><div class="library">${data.playbook.filter(x=>!flowData.filter||flowData.filter==='All'||x.category===flowData.filter).map(x=>`<article class="entry"><span class="pill">${esc(x.category)}</span><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>${x.why?`<div class="why">Why it helps: ${esc(x.why)}</div>`:''}<div class="entry-actions"><button data-action="helpful" data-id="${x.id}">${x.helpful?'♥ Helpful':'♡ Was this helpful?'}</button><button data-action="edit-playbook" data-id="${x.id}">Edit</button><button data-action="delete-playbook" data-id="${x.id}">Delete</button></div></article>`).join('')||'<div class="empty">Nothing here yet. Add a small strategy that has helped you before.</div>'}</div>`}
function future(){return `<div class="page-heading"><div><div class="eyebrow">A note from a past you</div><h1>Future Me</h1><p>Make a little plan for the moments you know can be hard.</p></div><button class="btn-primary" data-action="new-future">＋ Write a note</button></div><div class="library">${data.future.map(x=>`<article class="entry"><span class="pill">For a moment like…</span><h3>${esc(x.trigger)}</h3><p>“${esc(x.message)}”</p><div class="why"><b>A few things to try</b><br>${x.actions.map(esc).join(' · ')}</div><div class="entry-actions"><button data-action="revisit" data-id="${x.id}">Read this to myself</button><button data-action="edit-future" data-id="${x.id}">Edit</button><button data-action="delete-future" data-id="${x.id}">Delete</button></div></article>`).join('')||'<div class="empty">No notes yet. Leave a kind reminder for a future hard moment.</div>'}</div><p class="notice">Reminders are kept here for you to revisit when you choose. Beside does not send notifications in this prototype.</p>`}
function profile(){return `<div class="page-heading"><div><div class="eyebrow">Your space, your choices</div><h1>Profile &amp; settings</h1><p>Personalize your experience and manage what you’ve saved.</p></div></div><div class="profile-grid"><section class="profile-card"><h3>How this prototype works</h3><p>Your Playbook, Future Me notes, and preferences are saved in this browser only using local storage. No account or server is connected. Reflections you write in a support flow are not saved unless you choose to add them to your Playbook.</p></section><section class="profile-card"><h3>Your privacy, in plain language</h3><p>Your emotional disclosures are not used for advertising. Nothing you write is shared publicly by default. You can edit or delete saved entries, or clear this browser’s demo data at any time.</p></section><section class="profile-card"><h3>Supporter Mode</h3><p>Practical guides for listening, checking in, and finding the words to support someone.</p><button class="btn-secondary" style="margin-top:13px" data-page="Supporter Mode">Open Supporter Mode →</button></section><section class="profile-card"><h3>Safety resources</h3><p>Beside isn’t a crisis service and can’t provide emergency help.</p><div class="safety"><strong>U.S. Suicide &amp; Crisis Lifeline: 988</strong><p>Call or text 988. If you or someone else is in immediate danger, contact emergency services.</p></div></section><section class="profile-card"><h3>Demo data</h3><p>Reset saved entries and return to the sample Playbook and Future Me notes.</p><button class="btn-secondary" style="margin-top:13px" data-action="reset">Reset demo data</button> <button class="btn-quiet" data-action="replay-onboarding">View onboarding</button></section><section class="profile-card"><h3>Human connection</h3><p>Make it easier to ask someone you trust for a specific kind of support.</p><button class="btn-secondary" style="margin-top:13px" data-flow="beside">Write a message →</button></section>${(data.contacts||[]).length?`<section class="profile-card"><h3>Trusted contacts saved here</h3>${data.contacts.map(c=>`<p style="margin-top:10px"><b>${esc(c.name)}</b> · ${esc(c.need)}<br><button class="btn-quiet" data-action="delete-contact" data-id="${c.id}">Remove</button></p>`).join('')}</section>`:''}</div><p class="notice">Beside is for everyday emotional support. It does not diagnose, treat, or replace professional mental healthcare, therapy, or emergency services.</p>`}
const guides=[['Start with listening','You don’t need the perfect thing to say. Make room for their experience.',['Give your attention. Put distractions away if you can.','Reflect what you heard: “That sounds like a lot to carry.”','Let silence happen. You don’t have to fill every pause.']],['Ask what would help','Let them choose the kind of support that feels useful.',['Try: “Would it help to talk, be distracted, or think through options?”','Take their answer at face value.','Check before offering advice: “Would you like an idea, or should I just listen?”']],['What to avoid','Well-meant phrases can close a conversation.',['Avoid “Everything happens for a reason.”','Avoid comparing their experience to yours.','Avoid jumping to fixes before they’ve asked.']],['Check in afterward','Care can be a small, specific follow-up.',['Send a simple message the next day.','Name something concrete: “Thinking of you before that meeting.”','Offer a specific option, while making it easy to say no.']]];
function supporter(){return `<div class="page-heading"><div><div class="eyebrow">Supporter Mode</div><h1>Show up for someone</h1><p>You don’t need all the answers to help someone feel less alone.</p></div><button class="btn-secondary" data-page="Support">← Support</button></div><div class="guide-grid">${guides.map(([title,desc,items],i)=>`<article class="guide" data-guide="${i}"><span class="pill">A small guide</span><h3>${title}</h3><p>${desc}</p><div class="guide-detail" id="guide-${i}" hidden><ul>${items.map(it=>`<li>${it}</li>`).join('')}</ul></div></article>`).join('')}</div>`}
function render(){if(page==='Supporter Mode')page='Supporter Mode';document.getElementById('app').innerHTML=`<div class="shell">${nav()}${mobileNav()}<main class="main">${page==='Home'?home():page==='Support'?support():page==='My Playbook'?playbook():page==='Future Me'?future():page==='Supporter Mode'?supporter():profile()}</main></div>`;bind()}
function showModal(title,body,saveFn){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon-button" data-close aria-label="Close">×</button></div>${body}<div class="modal-actions"><button class="btn-quiet" data-close>Cancel</button><button class="btn-primary" data-save>Save</button></div></section></div>`;root.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>root.innerHTML='');root.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))root.innerHTML=''};root.querySelector('[data-save]').onclick=()=>{const result=saveFn(root);if(result!==false){root.innerHTML='';save();render();toast('Saved for you')}}}
function playbookModal(item){item=item||{};const opts=['Overthinking','Stress','Loneliness','Motivation','Confidence','Relationships','General wellbeing'];showModal(item.id?'Edit Playbook entry':'Add to your Playbook',`<div class="field"><label>Title</label><input name="title" maxlength="65" value="${esc(item.title||'')}" placeholder="A small thing that helps"></div><div class="field"><label>What is it?</label><textarea name="description" maxlength="280" placeholder="Describe the strategy…">${esc(item.description||'')}</textarea></div><div class="field"><label>Category</label><select name="category">${opts.map(x=>`<option ${item.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Why does it help? <span style="color:#888;font-weight:400">(optional)</span></label><input name="why" maxlength="150" value="${esc(item.why||'')}" placeholder="A note to yourself"></div>`,r=>{const title=r.querySelector('[name=title]').value.trim(),description=r.querySelector('[name=description]').value.trim();if(!title||!description){toast('Add a title and description first');return false}const x={...item,id:item.id||uid(),title,description,category:r.querySelector('[name=category]').value,why:r.querySelector('[name=why]').value.trim()};if(item.id)data.playbook=data.playbook.map(y=>y.id===item.id?x:y);else data.playbook.unshift(x)})}
function futureModal(item){item=item||{};showModal(item.id?'Edit Future Me note':'Write a note to Future Me',`<div class="field"><label>When might you need this?</label><input name="trigger" maxlength="80" value="${esc(item.trigger||'')}" placeholder="When I start overthinking…"></div><div class="field"><label>A message from you, today</label><textarea name="message" maxlength="500" placeholder="What would you want your future self to remember?">${esc(item.message||'')}</textarea></div><div class="field"><label>A few actions that may help <span style="color:#888;font-weight:400">(one per line)</span></label><textarea name="actions" maxlength="300" placeholder="Take a short walk&#10;Talk to someone I trust">${esc((item.actions||[]).join('\n'))}</textarea></div>`,r=>{const trigger=r.querySelector('[name=trigger]').value.trim(),message=r.querySelector('[name=message]').value.trim();if(!trigger||!message){toast('Add a situation and message first');return false}const x={...item,id:item.id||uid(),trigger,message,actions:r.querySelector('[name=actions]').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5)};if(item.id)data.future=data.future.map(y=>y.id===item.id?x:y);else data.future.unshift(x)})}
function resetScreen(){const activities=[['5 senses, one step at a time','A gentle way to reconnect with the room around you.'],['Slow the exhale','A short, guided breathing rhythm. Stop whenever you like.'],['Mini story break','Make a tiny, silly story from everyday details.'],['Release a little tension','A few optional, gentle body cues.']];const sense=[['5','Name five things you can see. Let your eyes land on ordinary things.'],['4','Notice four things you can feel against your skin or supporting your body.'],['3','Listen for three sounds, near or far.'],['2','Notice two scents, or two breaths of air. You can skip this.'],['1','Notice one taste, or simply the feeling in your mouth. You can skip this.']];const body=['Notice the support beneath your feet. If comfortable, let your toes soften.','Lift your shoulders a little, then let them drop. Notice what changes.','Unclench your jaw and soften around your eyes. No need to force it.'];const reflectionStep=flowData.activity===2?3:2;if(flowStep===0)return `<div class="eyebrow">A small reset, at your pace</div><h2>Choose something to try</h2><p>Each one takes a little time. Skip anything that doesn’t feel right.</p><div class="activity-grid">${activities.map((a,i)=>`<button class="activity" data-activity="${i}"><strong>${a[0]}</strong><small>${a[1]}</small></button>`).join('')}</div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">← Back</button></div>`;if(flowStep===1&&flowData.activity===0){const i=flowData.senseIndex||0;return `<div class="eyebrow">Grounding · ${i+1} of 5</div><h2>${sense[i][1]}</h2><p>Take your time. You can write a few words, or just notice quietly.</p><div class="field"><textarea id="sense-answer" placeholder="What do you notice?">${esc(flowData.senseAnswers?.[i]||'')}</textarea></div><div class="flow-actions"><button class="btn-quiet" data-reset-action="skip-sense">Skip this step</button><div class="steps">${sense.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><button class="btn-primary" data-reset-action="next-sense">${i===4?'Continue':'Next →'}</button></div>`}if(flowStep===1&&flowData.activity===1)return `<div class="eyebrow">Breathing pause · 5 gentle cycles</div><h2>Let the out-breath be a little longer.</h2><p>No need to breathe deeply or perfectly. Follow a comfortable rhythm, or stop at any time.</p><div class="breath-stage"><div class="breath-orb" id="breath-orb"><span id="breath-phase">Ready when you are</span></div><strong id="breath-time">00:50</strong></div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">Stop</button><button class="btn-primary" data-reset-action="breath-start">Begin breathing</button><button class="btn-secondary" data-reset-action="breath-finish">Finish whenever you’re ready</button></div>`;if(flowData.activity===2&&flowStep===1)return `<div class="eyebrow">Mini story break · 1 of 2</div><h2>Pick three everyday details.</h2><p>Use three things you can see nearby—or make them up. There’s no right answer.</p><div class="field"><label>Three things</label><input id="story-objects" value="${esc(flowData.storyObjects||'')}" placeholder="A mug, a sock, a tiny plant"></div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">← Back</button><button class="btn-primary" data-reset-action="story-next">Make a tiny story →</button></div>`;if(flowData.activity===2&&flowStep===2)return `<div class="eyebrow">Mini story break · 2 of 2</div><h2>Give those details a new life.</h2><p>Imagine they’re characters in a very short, slightly ridiculous story.</p><div class="field"><textarea id="story-line" placeholder="The mug challenged the tiny plant to a race…">${esc(flowData.storyLine||'')}</textarea></div><div class="flow-actions"><button class="btn-quiet" data-reset-action="story-back">← Change details</button><button class="btn-primary" data-reset-action="story-done">That’s my story →</button></div>`;if(flowData.activity===3&&flowStep===1){const i=flowData.bodyIndex||0;return `<div class="eyebrow">Body reset · ${i+1} of 3</div><h2>${body[i]}</h2><p>Only try what feels comfortable. You can skip any cue.</p><div class="response">Take a few seconds here. There’s no rush to move to the next one.</div><div class="flow-actions"><button class="btn-quiet" data-reset-action="next-body">Skip this cue</button><div class="steps">${body.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><button class="btn-primary" data-reset-action="next-body">${i===2?'Continue':'I tried that'}</button></div>`}if(flowStep===reflectionStep)return `<div class="eyebrow">Take a moment</div><h2>What are you noticing now?</h2><p>No need to call it good or bad. Pick what feels closest, or skip this.</p><div class="choice-list">${['A little more settled','About the same','More restless','Not sure yet'].map(v=>`<button class="choice ${flowData.resetFeeling===v?'selected':''}" data-reset-feeling="${esc(v)}">${v}</button>`).join('')}</div><div class="field"><label>Anything you want to remember? <span style="color:#888;font-weight:400">Optional</span></label><input id="reset-note" maxlength="140" placeholder="A small thing I noticed…" value="${esc(flowData.resetNote||'')}"></div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">Finish here</button><button class="btn-primary" data-reset-action="reflection-next">Choose a next step →</button></div>`;if(flowStep===reflectionStep+1)return `<div class="eyebrow">Your next ten minutes</div><h2>What feels doable from here?</h2><p>${flowData.resetFeeling?`You noticed: ${esc(flowData.resetFeeling.toLowerCase())}.`:''} Pick one, or simply stop here.</p><div class="choice-list"><button class="choice" data-next-choice="small">Take one small step now</button><button class="choice" data-next-choice="another">Try a different kind of support</button><button class="choice" data-next-choice="reachout">Reach out to someone</button><button class="choice" data-next-choice="stop">Stop here for now</button></div>`;if(flowStep===reflectAt+2)return `<div class="eyebrow">Your one small action</div><h2>What do you want to do next?</h2><p>Choose something small enough to begin in the next ten minutes. You can leave this blank if you prefer.</p><div class="field"><textarea id="next-action" placeholder="For example: send one text, get a glass of water, step outside…">${esc(flowData.userNextStep||'')}</textarea></div><div class="flow-actions"><button class="btn-quiet" data-action="complete-flow">Skip for now</button><button class="btn-primary" data-reset="finish-next">Keep this next step →</button></div>`;return `<div class="eyebrow">A gentle pause</div><h2>Take this at your own pace.</h2><button class="btn-primary" data-action="complete-flow">Continue</button>`}
function flowScreen(){const title=modes.find(m=>m[0]===flow)?.[1]||'';let content='';if(flow==='moment')content=`<div class="eyebrow">A little help, just for now</div><h2>What’s making this moment hard?</h2><p>Share a few words, or skip this. Your note stays on this screen unless you choose to save it.</p><div class="field"><textarea id="moment-context" placeholder="Start anywhere…">${esc(flowData.context||'')}</textarea></div><p style="font-weight:600;font-size:13px;margin:17px 0 9px">What would feel helpful?</p><div class="choice-list">${modes.map(([id,t,d])=>`<button class="choice ${flowData.momentMode===id?'selected':''}" data-moment-mode="${id}"><b>${t}</b><br><small>${d}</small></button>`).join('')}</div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">← Back</button><button class="btn-primary" data-action="moment-next">Let’s try that →</button></div>`;if(flow==='feedback')content=flowStep===0?`<div class="eyebrow">Before you go</div><h2>Did any part of that help?</h2><p>Your answer helps Beside remember only what you choose.</p><div class="choice-list"><button class="choice" data-action="feedback-helped">A little, yes</button><button class="choice" data-action="feedback-notyet">Not yet</button></div><p class="notice">Your words from this moment aren’t saved automatically.</p>`:flowStep===1?`<div class="eyebrow">Keep what worked</div><h2>Want to save this for another day?</h2><p>You can add this small strategy to your Playbook. It will only be saved if you choose.</p><div class="response"><b>${esc(flowData.suggestedStrategy?.title||'One small next step')}</b><br>${esc(flowData.suggestedStrategy?.description||'A small thing you chose for yourself.')}</div><div class="flow-actions"><button class="btn-quiet" data-action="feedback-finish">Not now</button><button class="btn-primary" data-action="save-feedback">Save to My Playbook</button></div>`:flowStep===3?`<div class="eyebrow">Saved for another day</div><h2>It’s in your Playbook.</h2><p>You can edit or delete it whenever you like.</p><div class="flow-actions"><button class="btn-primary" data-action="feedback-finish">Back to Beside</button></div>`:`<div class="eyebrow">Thank you for telling us</div><h2>We’ll keep figuring out what helps.</h2><p>You can try a different kind of support, or leave it here for now.</p><div class="flow-actions"><button class="btn-secondary" data-action="feedback-another">Try another way</button><button class="btn-primary" data-action="feedback-finish">Finish</button></div>`;if(flow==='listen'){if(flowStep===0)content=`<div class="eyebrow">A listening space</div><h2>What’s been weighing on you?</h2><p>Take your time. You can say as much or as little as you want.</p>${flowData.context?`<div class="response">You shared: “${esc(flowData.context)}”</div>`:''}<div class="field"><textarea id="reflection" placeholder="Start wherever you are…">${esc(flowData.reflection||flowData.context||'')}</textarea></div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">← Back</button><button class="btn-primary" data-action="listen-next">Continue</button></div>`;else content=`<div class="eyebrow">Thank you for sharing</div><h2>I’m glad you put that into words.</h2><p>You shared:</p><div class="response">“${esc(flowData.reflection)}”</div><p>Would it feel better to keep talking, or explore one small next step?</p><div class="flow-actions"><button class="btn-secondary" data-action="listen-again">Keep talking</button><button class="btn-primary" data-action="complete-flow">Explore a next step</button></div><p class="notice">This is a scripted reflection for the prototype, not an AI response. Your writing isn’t saved.</p>`}
if(flow==='clear'){const qs=['What happened?','What is bothering you most?','What is within your control?','What is outside your control?','What is one small thing you can do next?'];if(flowStep<5)content=`<div class="eyebrow">Let’s untangle it · ${flowStep+1} of 5</div><h2>${qs[flowStep]}</h2><p>There’s no need to get it perfectly right.</p>${flowData.context&&flowStep===0?`<div class="response">You shared: “${esc(flowData.context)}”</div>`:''}<div class="field"><textarea id="answer" placeholder="Write a few words…">${esc(flowData.answers?.[flowStep]||'')}</textarea></div><div class="flow-actions"><div class="steps">${qs.map((_,i)=>`<i class="${i<=flowStep?'on':''}"></i>`).join('')}</div><button class="btn-primary" data-action="clear-next">${flowStep===4?'See my summary':'Next →'}</button></div>`;else content=`<div class="eyebrow">A little clearer</div><h2>You found a next step.</h2><div class="response">${qs.map((q,i)=>`<p><b>${q}</b><br>${esc(flowData.answers?.[i]||'Not sure yet — and that’s okay.')}</p>`).join('<br>')}</div><p>You don’t need to do everything. What you named for the next step is enough for now.</p><div class="flow-actions"><button class="btn-primary" data-action="complete-flow">Done</button></div>`}
if(flow==='reset'){const acts=[['Five senses, step by step','Notice what’s already around you.'],['Slow the exhale','Breathe out a little longer than you breathe in.'],['Mini story break','Look for something round, something blue, something soft.'],['Release a little tension','Roll your shoulders, unclench your jaw, stretch your hands.']];if(flowStep===0)content=`<div class="eyebrow">A gentle shift</div><h2>Pick a small reset</h2><p>You can stop whenever you like. Choose what feels doable.</p><div class="activity-grid">${acts.map((a,i)=>`<button class="activity" data-activity="${i}"><strong>${a[0]}</strong><small>${a[1]}</small></button>`).join('')}</div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">← Back</button></div>`;else if(flowStep===1)content=`<div class="eyebrow">${esc(flowData.activityTitle)}</div><h2>${esc(flowData.activityPrompt)}</h2><p>${flowData.activity===0?'Wherever you are, notice at your own pace.':flowData.activity===1?'Try breathing in for 4, then out for 6. No need to force it.':flowData.activity===2?'Take a moment to find each one around you.': 'Go gently, only as much as feels comfortable.'}</p>${flowData.activity===1?`<div class="countdown"><strong id="timer">01:00</strong><button class="btn-secondary" data-action="timer">Start one-minute pause</button></div>`:`<div class="field"><textarea id="activity-note" placeholder="What did you notice? (optional)"></textarea></div>`}<div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">Choose another</button><button class="btn-primary" data-action="complete-flow">I’m ready</button></div>`}
if(flow==='beside'){if(flowStep===0){const choices=['Someone to listen','Someone to distract me','Help thinking something through','Someone to check in later','Someone to spend time with me'];content=`<div class="eyebrow">Make reaching out easier</div><h2>What kind of support would feel good?</h2><p>You get to ask for exactly what you need.</p><div class="choice-list">${choices.map(x=>`<button class="choice ${flowData.need===x?'selected':''}" data-need="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">← Back</button><button class="btn-primary" data-action="message-next">Write a message</button></div>`}else content=`<div class="eyebrow">A message you can make your own</div><h2>Who came to mind?</h2><p>Edit this so it sounds like you. Nothing is sent from Beside.</p><div class="field"><label>Name (optional)</label><input id="contact-name" placeholder="Their name"></div><div class="field"><label>Your message</label><textarea id="message-text">${esc(flowData.message||messageFor(flowData.need))}</textarea></div><div class="flow-actions"><button class="btn-quiet" data-action="message-back">← Change support</button><button class="btn-secondary" data-action="share-message">Share</button><button class="btn-secondary" data-action="copy-message">Copy</button><button class="btn-primary" data-action="save-contact">Save contact</button><button class="btn-quiet" data-action="complete-flow">Done</button></div><p class="notice">Copying opens no external app. Paste it into a message whenever you’re ready.</p>`}
return `<div class="flow-card">${content}</div>`}
function messageFor(n){const map={'Someone to listen':'Hey, I’ve had a difficult day. I don’t really need advice, but I’d appreciate someone to talk to. Are you free for a few minutes?','Someone to distract me':'Hey, I could use a little distraction today. Would you be up for a quick chat or doing something together?','Help thinking something through':'Hey, something’s been on my mind. Would you have a little time to help me think it through?','Someone to check in later':'Hey, today’s a bit of a lot. Could you check in on me later when you have a moment?','Someone to spend time with me':'Hey, I’ve been feeling a little on my own. Would you be up for spending some time together soon?'};return map[n]||'Hey, I could use a little support today. Are you free for a few minutes?'}
function startFlow(id,seedData={}){if(resetBreathInterval){clearInterval(resetBreathInterval);resetBreathInterval=null}flow=id;flowStep=0;flowData={answers:[],...seedData};if(id==='clear'&&seedData.context)flowData.answers[0]=seedData.context;render();if(!document.querySelector('.flow-card')){document.querySelector('main').innerHTML=flowScreen();bind()}}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;flowData={};render()});document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>startFlow(b.dataset.flow));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{flowData.filter=b.dataset.filter;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));document.querySelectorAll('[data-activity]').forEach(b=>b.onclick=()=>{const a=[['Five senses, step by step','Take a moment to notice what’s around you.'],['Slow the exhale','Try breathing in for 4, then out for 6.'],['Mini story break','Use three everyday things to make a tiny story.'],['Release a little tension','Roll your shoulders and unclench your jaw.']][+b.dataset.activity];flowData.activity=+b.dataset.activity;flowData.activityTitle=a[0];flowData.activityPrompt=a[1];flowStep=1;document.querySelector('.flow-card').outerHTML=flowScreen();bind()});document.querySelectorAll('[data-need]').forEach(b=>b.onclick=()=>{flowData.need=b.dataset.need;document.querySelectorAll('[data-need]').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelectorAll('[data-moment-mode]').forEach(b=>b.onclick=()=>{flowData.momentMode=b.dataset.momentMode;document.querySelectorAll('[data-moment-mode]').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{const d=b.querySelector('.guide-detail');d.hidden=!d.hidden});}
function completeFlow(){if(flow==='clear'){const next=flowData.answers?.[4]||'Take one small next step';flowData.suggestedStrategy={title:next.slice(0,65),description:'A next step I chose while sorting through what was on my mind.',category:'General wellbeing',why:'I chose this for myself.',helpful:true}}else if(flow==='reset'){flowData.suggestedStrategy={title:flowData.activityTitle||'A short reset',description:flowData.activityPrompt||'Take a moment to notice what is around me.',category:'Stress',why:'I chose to try this.',helpful:true}}else if(flow==='beside'){flowData.suggestedStrategy={title:'Ask someone for the support I need',description:'I can reach out and ask for the kind of support that would feel good.',category:'Relationships',why:'Connection is one option I can choose.',helpful:true}}else{flowData.suggestedStrategy={title:'Give myself space to talk',description:'Putting what is weighing on me into words can help me notice what I need.',category:'General wellbeing',why:'I chose to make space for this.',helpful:true}}flow='feedback';flowStep=0;document.querySelector('.flow-card').outerHTML=flowScreen();bind()}
function action(a,id){if(a==='moment-next'){const mode=flowData.momentMode,context=document.getElementById('moment-context').value.trim();if(!mode){toast('Choose what kind of support would feel right');return}startFlow(mode,{context,need:flowData.need});return}if(a==='feedback-helped'){flowStep=1;document.querySelector('.flow-card').outerHTML=flowScreen();bind();return}if(a==='feedback-notyet'){flowStep=2;document.querySelector('.flow-card').outerHTML=flowScreen();bind();return}if(a==='feedback-another'){startFlow('moment');return}if(a==='feedback-finish'){flow=null;flowStep=0;page='Home';render();return}if(a==='save-feedback'){const x=flowData.suggestedStrategy;if(x)data.playbook.unshift({id:uid(),...x});save();flowStep=3;document.querySelector('.flow-card').outerHTML=flowScreen();bind();toast('Saved to My Playbook');return}if(a==='complete-flow'){completeFlow();return}if(a==='new-playbook')return playbookModal();if(a==='edit-playbook')return playbookModal(data.playbook.find(x=>x.id===id));if(a==='delete-playbook'){data.playbook=data.playbook.filter(x=>x.id!==id);save();render();toast('Removed from your Playbook');return}if(a==='helpful'){let x=data.playbook.find(x=>x.id===id);x.helpful=!x.helpful;save();render();toast(x.helpful?'Thanks for letting us know':'Feedback updated');return}if(a==='new-future')return futureModal();if(a==='edit-future')return futureModal(data.future.find(x=>x.id===id));if(a==='delete-future'){data.future=data.future.filter(x=>x.id!==id);save();render();toast('Note deleted');return}if(a==='delete-contact'){data.contacts=(data.contacts||[]).filter(x=>x.id!==id);save();render();toast('Contact removed from this device');return}if(a==='revisit'){const x=data.future.find(x=>x.id===id);showModal('A note for you',`<div class="response">“${esc(x.message)}”</div><p><b>When:</b> ${esc(x.trigger)}</p><p style="margin-top:10px"><b>You could try:</b><br>${x.actions.map(esc).join(' · ')||'Take one small step.'}</p>`,()=>true);return}if(a==='reset'){if(confirm('Reset all Beside demo data in this browser?')){localStorage.removeItem('beside-data');data=read();page='Home';render();toast('Demo data reset')}return}if(a==='replay-onboarding'){data.onboarded=false;save();onboarding();return}if(a==='exit-flow'){if(resetBreathInterval){clearInterval(resetBreathInterval);resetBreathInterval=null}flow=null;flowStep=0;page='Support';render();return}if(a==='listen-next'){flowData.reflection=document.getElementById('reflection').value.trim();if(!flowData.reflection){toast('Write a little or choose another way to begin');return}flowStep=1;document.querySelector('.flow-card').outerHTML=flowScreen();bind();return}if(a==='listen-again'){flowStep=0;document.querySelector('.flow-card').outerHTML=flowScreen();bind();return}if(a==='listen-end'){flow=null;page='Support';render();toast('Whenever you’re ready, choose a next step');return}if(a==='clear-next'){flowData.answers=flowData.answers||[];flowData.answers[flowStep]=document.getElementById('answer').value.trim();flowStep++;document.querySelector('.flow-card').outerHTML=flowScreen();bind();return}if(a==='flow-done'){flow=null;page='Home';render();return}if(a==='save-step'){const val=flowData.answers?.[4]||'Take one small step';data.playbook.unshift({id:uid(),title:val.slice(0,65),description:'A next step from a clear thinking session.',category:'General wellbeing',why:'I chose this for myself.'});save();toast('Added your next step to the Playbook');return}if(a==='message-next'){if(!flowData.need){toast('Choose what kind of support you want first');return}flowStep=1;flowData.message=messageFor(flowData.need);document.querySelector('.flow-card').outerHTML=flowScreen();bind();return}if(a==='message-back'){flowStep=0;document.querySelector('.flow-card').outerHTML=flowScreen();bind();return}if(a==='share-message'){const txt=document.getElementById('message-text').value;if(navigator.share){navigator.share({title:'A message from Beside',text:txt}).then(()=>toast('Share sheet opened')).catch(e=>{if(e.name!=='AbortError')toast('You can copy the message instead')})}else fallbackCopy(txt);return}if(a==='copy-message'){const txt=document.getElementById('message-text').value;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Message copied')).catch(()=>fallbackCopy(txt))}else fallbackCopy(txt);return}if(a==='save-contact'){const name=document.getElementById('contact-name').value.trim();if(!name){toast('Add their name to save this contact');return}data.contacts=data.contacts||[];data.contacts.push({id:uid(),name,need:flowData.need,message:document.getElementById('message-text').value});save();toast('Contact saved on this device');return}if(a==='timer'){let s=60;const b=document.querySelector('[data-action=timer]');b.disabled=true;b.textContent='Breathing…';const t=document.getElementById('timer');const iv=setInterval(()=>{if(!document.body.contains(t)){clearInterval(iv);return}s--;t.textContent=`00:${String(s).padStart(2,'0')}`;if(s<=0){clearInterval(iv);t.textContent='Done';b.textContent='One minute complete';toast('You made a little space for yourself')}},1000)}}
function fallbackCopy(txt){const t=document.createElement('textarea');t.value=txt;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('Message copied')}
function onboarding(){const root=document.getElementById('onboarding');root.hidden=false;let step=0,selected=[];const draw=()=>{root.innerHTML=`<section class="onboard-card ${step===0?'welcome-card':''}">${step===0?`<div class="welcome-splash"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 29h9v-8h8v-8h8"/><path d="m26 9 7 4-7 4"/></svg></span>Beside</div><div class="welcome-art" aria-hidden="true"><svg viewBox="0 0 210 190"><circle cx="120" cy="85" r="60" fill="#ffd978"/><circle cx="120" cy="85" r="43" fill="#ffefa9"/><path d="M54 136h35v-27h32V82h30" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="m141 68 18 14-18 14" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="62" r="8" fill="#9ce8d2"/><path d="M40 32v12M34 38h12" stroke="#f7a7e8" stroke-width="4" stroke-linecap="round"/><circle cx="174" cy="144" r="7" fill="#ffa982"/></svg></div><div class="welcome-kicker">A SOFTER PLACE TO LAND</div><h1>Whatever brought you here, <em>you belong here.</em></h1><p>Maybe your mind won’t switch off. Maybe everything feels like a lot. Maybe you just need a moment to catch your breath. You don’t have to have the right words—we’ll help you find what might help next.</p><div class="welcome-chips"><span>Overthinking</span><span>Feeling overwhelmed</span><span>Not sure yet</span></div></div><div class="welcome-lower"><div class="welcome-reassure"><span>✳</span><div><b>Start anywhere.</b><small>There’s no perfect way to do this.</small></div></div><div class="onboard-actions"><button class="btn-quiet" data-skip>Explore first</button><button class="btn-primary" data-next>Find my kind of support <span>→</span></button></div><p class="notice">Your saved entries stay in this browser. Edit or delete them whenever you like.</p></div>`:step===1?`<div class="onboard-step"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 29h9v-8h8v-8h8"/><path d="m26 9 7 4-7 4"/></svg></span>Beside</div><div class="eyebrow">Optional · 1 of 2</div><h2>What’s bringing you here today?</h2><p>Pick anything that feels close. You can skip this.</p><div class="onboard-options">${['My thoughts won’t slow down','Everything feels like too much','I’ve been feeling alone','I’m doubting myself','Something with someone I care about','I feel stuck or drained','A difficult decision','I just need a little support'].map(x=>`<button class="${selected.includes(x)?'selected':''}" data-opt="${x}">${x}</button>`).join('')}</div><div class="onboard-actions"><button class="btn-quiet" data-skip>Skip questions</button><button class="btn-primary" data-next>Continue →</button></div></div>`:`<div class="onboard-step"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 29h9v-8h8v-8h8"/><path d="m26 9 7 4-7 4"/></svg></span>Beside</div><div class="eyebrow">Optional · 2 of 2</div><h2>What would feel most helpful?</h2><p>There’s no wrong answer. You can change direction anytime.</p><div class="onboard-options">${['Someone to listen','A practical next step','A gentle distraction','Help reaching out to someone','I’m not sure yet'].map(x=>`<button class="${selected.includes(x)?'selected':''}" data-opt="${x}">${x}</button>`).join('')}</div><div class="onboard-actions"><button class="btn-quiet" data-skip>Skip questions</button><button class="btn-primary" data-next>Start with Beside</button></div></div>`}</section>`;root.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{selected.includes(b.dataset.opt)?selected=selected.filter(x=>x!==b.dataset.opt):selected.push(b.dataset.opt);draw()});root.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{if(step<2){step++;draw()}else finish()});root.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>finish())};const finish=()=>{data.onboarded=true;data.preferences={choices:selected};save();root.hidden=true;page='Home';render()};draw()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-flow]');if(b){} });
function resetExercise(){const activities=[['Five senses, step by step','Move through five short prompts at your own pace.'],['Slow the exhale','Try five comfortable breathing cycles. Stop at any time.'],['Make a tiny story','Turn three ordinary details into something silly.'],['Release a little tension','Try three gentle body cues; skip anything you like.']];const senses=['Name five things you can see. Let your eyes land on ordinary things.','Notice four things you can feel against your skin or supporting your body.','Listen for three sounds, near or far.','Notice two scents, or two breaths of air. You can skip this.','Notice one taste, or simply the feeling in your mouth. You can skip this.'];const body=['Notice the support beneath your feet. If comfortable, let your toes soften.','Lift your shoulders a little, then let them drop. Notice what changes.','Unclench your jaw and soften around your eyes. No need to force it.'];const idx=flowData.senseIndex||0,bodyIdx=flowData.bodyIndex||0,reflectAt=flowData.activity===2?3:2;
if(flowStep===0)return `<div class="eyebrow">A small reset, at your pace</div><h2>Choose something to try</h2><p>Each one takes a little time. Skip anything that doesn’t feel right.</p><div class="activity-grid">${activities.map((a,i)=>`<button class="activity" data-activity="${i}"><strong>${a[0]}</strong><small>${a[1]}</small></button>`).join('')}</div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">← Back</button></div>`;
if(flowData.activity===0&&flowStep===1)return `<div class="eyebrow">Five senses · ${idx+1} of 5</div><h2>${senses[idx]}</h2><p>Take your time. Write a few words or simply notice quietly.</p><div class="field"><textarea id="sense-answer" placeholder="What do you notice?">${esc(flowData.senseAnswers?.[idx]||'')}</textarea></div><div class="flow-actions"><button class="btn-quiet" data-reset="skip-sense">Skip this step</button><div class="steps">${senses.map((_,j)=>`<i class="${j<=idx?'on':''}"></i>`).join('')}</div><button class="btn-primary" data-reset="next-sense">${idx===4?'Continue':'Next →'}</button></div>`;
if(flowData.activity===1&&flowStep===1)return `<div class="eyebrow">Breathing pause · 5 gentle cycles</div><h2>Let the out-breath be a little longer.</h2><p>No need to breathe deeply or perfectly. Follow a comfortable rhythm, or stop at any time.</p><div class="breath-stage"><div class="breath-orb" id="breath-orb"><span id="breath-phase">Ready when you are</span></div><strong id="breath-time">00:50</strong></div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">Stop</button><button class="btn-primary" data-reset="breath-start">Begin breathing</button><button class="btn-secondary" data-reset="breath-finish">Finish whenever you’re ready</button></div>`;
if(flowData.activity===2&&flowStep===1)return `<div class="eyebrow">Mini story · 1 of 2</div><h2>Pick three everyday details.</h2><p>Use things you can see nearby, or make them up. There’s no right answer.</p><div class="field"><label>Three things</label><input id="story-objects" value="${esc(flowData.storyObjects||'')}" placeholder="A mug, a sock, a tiny plant"></div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">← Back</button><button class="btn-primary" data-reset="story-next">Make a tiny story →</button></div>`;
if(flowData.activity===2&&flowStep===2)return `<div class="eyebrow">Mini story · 2 of 2</div><h2>Give those details a new life.</h2><p>Imagine they’re characters in a very short, slightly ridiculous story.</p><div class="field"><textarea id="story-line" placeholder="The mug challenged the tiny plant to a race…">${esc(flowData.storyLine||'')}</textarea></div><div class="flow-actions"><button class="btn-quiet" data-reset="story-back">← Change details</button><button class="btn-primary" data-reset="story-done">That’s my story →</button></div>`;
if(flowData.activity===3&&flowStep===1)return `<div class="eyebrow">Body reset · ${bodyIdx+1} of 3</div><h2>${body[bodyIdx]}</h2><p>Only try what feels comfortable. You can skip any cue.</p><div class="response">Take a few seconds here. There’s no rush to move to the next one.</div><div class="flow-actions"><button class="btn-quiet" data-reset="next-body">Skip this cue</button><div class="steps">${body.map((_,j)=>`<i class="${j<=bodyIdx?'on':''}"></i>`).join('')}</div><button class="btn-primary" data-reset="next-body">${bodyIdx===2?'Continue':'I tried that'}</button></div>`;
if(flowStep===reflectAt)return `<div class="eyebrow">Take a moment</div><h2>What are you noticing now?</h2><p>No need to call it good or bad. Pick what feels closest, or skip this.</p><div class="choice-list">${['A little more settled','About the same','More restless','Not sure yet'].map(v=>`<button class="choice ${flowData.resetFeeling===v?'selected':''}" data-reset-feeling="${esc(v)}">${v}</button>`).join('')}</div><div class="field"><label>Anything you want to remember? <span style="color:#888;font-weight:400">Optional</span></label><input id="reset-note" maxlength="140" placeholder="A small thing I noticed…" value="${esc(flowData.resetNote||'')}"></div><div class="flow-actions"><button class="btn-quiet" data-action="exit-flow">Finish here</button><button class="btn-primary" data-reset="reflection-next">Choose a next step →</button></div>`;
if(flowStep===reflectAt+1)return `<div class="eyebrow">Your next ten minutes</div><h2>What feels doable from here?</h2><p>${flowData.resetFeeling?`You noticed: ${esc(flowData.resetFeeling.toLowerCase())}.`:''} Pick one, or simply stop here.</p><div class="choice-list"><button class="choice" data-next-choice="small">Take one small step now</button><button class="choice" data-next-choice="another">Try a different kind of support</button><button class="choice" data-next-choice="reachout">Reach out to someone</button><button class="choice" data-next-choice="stop">Stop here for now</button></div>`;
return `<div class="eyebrow">A gentle pause</div><h2>Take this at your own pace.</h2><button class="btn-primary" data-action="complete-flow">Continue</button>`}
const baseFlowScreen=flowScreen;flowScreen=function(){return flow==='reset'?`<div class="flow-card">${resetExercise()}</div>`:baseFlowScreen()};
function resetRender(){const c=document.querySelector('.flow-card');if(c)c.outerHTML=flowScreen();bind()}
function finishBreath(){if(resetBreathInterval){clearInterval(resetBreathInterval);resetBreathInterval=null}flowStep=2;resetRender()}
let resetBreathInterval=null;
document.addEventListener('click',e=>{const r=e.target.closest('[data-reset]');if(r){const a=r.dataset.reset;if(a==='next-sense'||a==='skip-sense'){const i=flowData.senseIndex||0,v=a==='next-sense'?document.getElementById('sense-answer').value.trim():'';if(a==='next-sense'&&!v){toast('Write a few words or choose skip');return}flowData.senseAnswers=flowData.senseAnswers||[];flowData.senseAnswers[i]=v;if(i>=4)flowStep=2;else flowData.senseIndex=i+1;resetRender();return}if(a==='next-body'){if((flowData.bodyIndex||0)>=2)flowStep=2;else flowData.bodyIndex=(flowData.bodyIndex||0)+1;resetRender();return}if(a==='story-next'){const v=document.getElementById('story-objects').value.trim();if(!v){toast('Add a few details, or choose another reset');return}flowData.storyObjects=v;flowStep=2;resetRender();return}if(a==='story-back'){flowStep=1;resetRender();return}if(a==='story-done'){const v=document.getElementById('story-line').value.trim();if(!v){toast('Write a tiny story, even just one sentence');return}flowData.storyLine=v;flowStep=3;resetRender();return}if(a==='reflection-next'){flowData.resetNote=document.getElementById('reset-note').value.trim();flowStep=flowData.activity===2?4:3;resetRender();return}if(a==='finish-next'){const v=document.getElementById('next-action').value.trim();if(!v){toast('Add a small action, or choose Skip for now');return}flowData.userNextStep=v;completeFlow();return}if(a==='breath-finish'){finishBreath();return}if(a==='breath-start'){if(resetBreathInterval)return;let elapsed=0;const phase=document.getElementById('breath-phase'),time=document.getElementById('breath-time'),orb=document.getElementById('breath-orb'),button=document.querySelector('[data-reset="breath-start"]');button.disabled=true;button.textContent='Breathing together…';const tick=()=>{const cycle=elapsed%10;phase.textContent=cycle<4?'Breathe in gently':'Let the breath out slowly';orb.classList.toggle('inhale',cycle<4);orb.classList.toggle('exhale',cycle>=4);time.textContent='00:'+String(Math.max(0,50-elapsed)).padStart(2,'0');elapsed++;if(elapsed>50)finishBreath()};tick();resetBreathInterval=setInterval(tick,1000);return}}const f=e.target.closest('[data-reset-feeling]');if(f){flowData.resetFeeling=f.dataset.resetFeeling;document.querySelectorAll('[data-reset-feeling]').forEach(x=>x.classList.toggle('selected',x===f));return}const n=e.target.closest('[data-next-choice]');if(n){const choice=n.dataset.nextChoice;if(choice==='another')startFlow('reset',{context:flowData.context});else if(choice==='reachout')startFlow('beside',{context:flowData.context});else if(choice==='small'){flowData.nextChoice=choice;flowStep=(flowData.activity===2?3:2)+2;resetRender()}else completeFlow()}});
const priorCompleteFlow=completeFlow;completeFlow=function(){if(flow==='reset'){const names=['Five senses, step by step','Slow the exhale','Make a tiny story','Release a little tension'];const details=['Move through the five senses one prompt at a time.','Follow five comfortable breathing cycles.','Make a playful story from ordinary details.','Try three gentle body cues at your own pace.'];flowData.activityTitle=names[flowData.activity]||'A gentle reset';flowData.activityPrompt=details[flowData.activity]||'Take a few moments at your own pace.'}priorCompleteFlow();if(flow==='feedback'&&flowData.userNextStep&&flowData.suggestedStrategy){flowData.suggestedStrategy.title=flowData.userNextStep.slice(0,65);flowData.suggestedStrategy.description='A next step I chose after trying '+flowData.activityTitle.toLowerCase()+'.'}};
render();if(!data.onboarded)onboarding();
</script></body></html>
